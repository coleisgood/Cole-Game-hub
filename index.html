<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cole's Game Hub</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}

header{
    text-align:center;
    padding:30px;
    background:#1e293b;
}

h1{
    margin:0;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.card h2{
    margin-top:0;
}

.play{
    display:inline-block;
    margin-top:10px;
    padding:12px 20px;
    background:#22c55e;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>🎮 Cole's Game Hub</h1>
<p>My favorite games and websites</p>
</header>

<div class="games">

<div class="card">
<h2>🕹️ Poki</h2>
<p>Play browser games instantly.</p>
<a class="play" href="https://poki.com">Open Poki</a>
</div>

<div class="card">
<h2>📚 Cool Math Games</h2>
<p>Puzzles, strategy, and arcade games.</p>
<a class="play" href="https://www.coolmathgames.com">Open Cool Math Games</a>
</div>

<div class="card">
<h2>🎥 YouTube</h2>
<p>Watch videos and creators.</p>
<a class="play" href="https://www.youtube.com">Open YouTube</a>
</div>

<div class="card">
<h2>🎮 Roblox</h2>
<p>Play Roblox experiences.</p>
<a class="play" href="https://www.roblox.com">Open Roblox</a>
</div>

</div>

</body>
</html>
