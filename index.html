<!DOCTYPE html>
<html>
<head>
  <title>Game Hub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .nav {
      padding: 10px;
      background: #222;
    }

    .nav button {
      margin-right: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
    }
  </style>
</head>
<body>

<div class="nav">
  <button onclick="openSite('https://poki.com')">Poki</button>
  <button onclick="openSite('https://www.coolmathgames.com')">Cool Math Games</button>
  <button onclick="openSite('https://www.youtube.com')">YouTube</button>
</div>

<iframe id="viewer"></iframe>

<script>
function openSite(url) {
  document.getElementById('viewer').src = url;
}
</script>

</body>
</html>
